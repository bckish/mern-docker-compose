<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Task Platform</title></head>
<body><main><h1>Task Platform</h1><form id="form"><input id="title" required placeholder="New task"><button>Add</button></form><ul id="tasks"></ul></main>
<script>
const tasks = document.querySelector('#tasks');
async function load() { tasks.innerHTML = (await fetch('http://localhost:3000/tasks').then(r => r.json())).map(t => `<li>${t.title}</li>`).join(''); }
document.querySelector('#form').addEventListener('submit', async e => { e.preventDefault(); await fetch('http://localhost:3000/tasks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:title.value})}); title.value=''; load(); });
load();
</script></body></html>
