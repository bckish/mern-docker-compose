services:
  api:
    build: ./api
    environment:
      MONGO_URL: mongodb://mongo:27017/tasks
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - api
  mongo:
    image: mongo:8
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
